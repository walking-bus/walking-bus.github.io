<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="LUSU Walking Bus departures for campus e-screens">
    <title>Walking Bus departures</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css?v=20261028-six-services">
  </head>
  <body class="screen-page" data-page="screen" data-screen-mode="today">
    <main class="screen-shell">
      <header class="screen-header">
        <div class="screen-title">
          <img class="walking-bus-logo" src="walking-bus-logo.webp" alt="Catch the Walking Bus">
          <h1 id="screen-heading">Today’s departures</h1>
          <p class="date-line" id="screen-date"></p>
          <aside class="route-key screen-route-key" aria-label="Route key">
            <span class="route-key-item route-1"><strong class="route-roundel">Route 1 · Roses are Red</strong></span>
            <span class="route-key-item route-2"><strong class="route-roundel">Route 2 · Duck’s Waddle</strong></span>
          </aside>
        </div>

        <div class="campaign-lockup" aria-label="Bus Boycott Guide, a campaign by your LUSU President Kate Bracewell">
          <img class="campaign-wordmark" src="bus-boycott-guide.webp" alt="Bus Boycott Guide">
          <img class="kate-bus" src="kate-bus.webp" alt="Kate Bracewell with a bus">
        </div>
      </header>

      <div class="screen-views" aria-live="polite">
        <section class="screen-view is-active" data-screen-view="today" aria-label="Today’s Walking Bus departures">
          <div class="today-list" id="today-list"></div>
        </section>

        <section class="screen-view" data-screen-view="week" aria-label="This week’s Walking Bus departures" aria-hidden="true">
          <div class="week-grid" id="screen-week-grid"></div>
        </section>
      </div>

      <footer class="screen-footer">
        <div class="page-progress" aria-hidden="true"><span class="is-active"></span><span></span></div>
        <p id="screen-updated">Loading timetable…</p>
        <img class="lusu-mark" src="lusu-flag.webp" alt="LUSU">
      </footer>
    </main>

    <template id="today-departure-template">
      <article class="today-departure">
        <time class="departure-time"></time>
        <div class="departure-route">
          <h2 class="route-name"></h2>
          <p class="route-stops"></p>
        </div>
        <p class="destination"><span>To</span><strong></strong></p>
      </article>
    </template>

    <script src="config.js?v=20261026-portrait-fix"></script>
    <script src="app.js?v=20261028-six-services"></script>
  </body>
</html>
